<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>FOSS Mapping Benchmark</title>

    <!-- MapLibre CSS -->
    <link
            rel="stylesheet"
            href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------------- HEADER ---------------- */

        .header {
            height: 60px;
            padding: 0 24px;

            display: flex;
            align-items: center;

            background: white;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
        }

        /* ---------------- CONTROLS ---------------- */

        .controls {
            min-height: 75px;

            padding: 12px 24px;

            display: flex;
            align-items: center;
            gap: 10px;

            background: white;
            border-bottom: 1px solid #ddd;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 12px;
            color: #666;
        }

        .input-group input {
            width: 300px;
            height: 38px;

            padding: 0 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #555;
        }

        #compareButton {
            height: 38px;

            margin-top: 17px;

            padding: 0 18px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }

        #compareButton:hover {
            opacity: 0.85;
        }

        #compareButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-left: 8px;
            margin-top: 17px;

            font-size: 13px;
            color: #666;
        }

        /* ---------------- MAP ---------------- */

        #map {
            flex: 1;
            min-height: 0;
        }

        /* ---------------- RESULTS ---------------- */

        .results {
            min-height: 100px;

            padding: 15px 24px;

            display: flex;
            gap: 50px;

            background: white;

            border-top: 1px solid #ddd;
        }

        .provider {
            min-width: 180px;
        }

        .provider-name {
            margin-bottom: 7px;

            font-size: 15px;
            font-weight: bold;
        }

        .provider-info {
            font-size: 14px;
            line-height: 1.5;
            color: #555;
        }

        .osrm {
            color: #e74c3c;
        }

        .valhalla {
            color: #3498db;
        }

        .google {
            color: #27ae60;
        }

    </style>

</head>


<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>
            FOSS Mapping Benchmark
        </h1>

    </div>


    <!-- ================= INPUTS ================= -->

    <div class="controls">

        <div class="input-group">

            <label for="start">
                Starting address
            </label>

            <input
                    id="start"
                    type="text"
                    placeholder="Enter starting address"
                    value="Tokyo Station"
            >

        </div>


        <div class="input-group">

            <label for="destination">
                Destination address
            </label>

            <input
                    id="destination"
                    type="text"
                    placeholder="Enter destination address"
                    value="Shibuya Station"
            >

        </div>


        <button id="compareButton">
            Compare Routes
        </button>


        <span id="status"></span>

    </div>


    <!-- ================= MAP ================= -->

    <div id="map"></div>


    <!-- ================= RESULTS ================= -->

    <div class="results">

        <div class="provider">

            <div class="provider-name osrm">
                OSRM
            </div>

            <div
                    id="osrm-result"
                    class="provider-info"
            >
                No route
            </div>

        </div>


        <div class="provider">

            <div class="provider-name valhalla">
                Valhalla
            </div>

            <div
                    id="valhalla-result"
                    class="provider-info"
            >
                No route
            </div>

        </div>


        <div class="provider">

            <div class="provider-name google">
                Google
            </div>

            <div
                    id="google-result"
                    class="provider-info"
            >
                No route
            </div>

        </div>

    </div>

</div>


<!-- ================= MAPLIBRE ================= -->

<script
        src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js">
</script>


<script>

    /*
     * =====================================================
     * MAP
     * =====================================================
     */

    console.log("MapLibre:", typeof maplibregl);

    const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/bright",
        center: [139.7671, 35.6812],
        zoom: 11
    });

    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );

    map.on("load", function () {
        console.log("Map loaded");
    });



    /*
     * =====================================================
     * COMPARE ROUTES
     * =====================================================
     */

    async function compareRoutes() {

        console.log("Compare button clicked");


        const start =
            document.getElementById("start").value.trim();


        const destination =
            document
                .getElementById("destination")
                .value
                .trim();


        const status =
            document.getElementById("status");


        const button =
            document.getElementById("compareButton");


        /*
         * Validate inputs
         */

        if (!start || !destination) {

            status.textContent =
                "Please enter both addresses.";

            return;

        }


        /*
         * Disable button
         */

        button.disabled = true;

        status.textContent =
            "Calculating routes...";


        try {

            /*
             * Call Spring Boot backend
             */

            const response = await fetch(
                "/api/routes/compare",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        startAddress: start,

                        endAddress: destination

                    })

                }
            );


            console.log(
                "HTTP status:",
                response.status
            );


            /*
             * Check HTTP response
             */

            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "Backend error:",
                    errorText
                );

                throw new Error(
                    "Backend returned HTTP "
                    + response.status
                );

            }


            /*
             * Convert response to JSON
             */

            const data =
                await response.json();


            console.log(
                "Backend response:",
                data
            );


            /*
             * Draw routes
             */

            drawRoutes(data);


            /*
             * Update distance/duration
             */

            updateResults(data);


            status.textContent =
                "Routes loaded.";

        }

        catch (error) {

            console.error(
                "Route request failed:",
                error
            );


            status.textContent =
                "Failed to calculate routes.";

        }

        finally {

            button.disabled = false;

        }

    }


    /*
     * =====================================================
     * DRAW ALL ROUTES
     * =====================================================
     */

    function drawRoutes(data) {

        console.log(
            "Drawing routes:",
            data
        );


        /*
         * Remove previous routes
         */

        removeExistingRoutes();


        /*
         * OSRM
         */

        if (
            data.osrm &&
            data.osrm.geometry &&
            data.osrm.geometry.length > 0
        ) {

            addRoute(

                "osrm-route",

                data.osrm.geometry,

                "#e74c3c",

                6

            );

        }


        /*
         * Valhalla
         */

        if (
            data.valhalla &&
            data.valhalla.geometry &&
            data.valhalla.geometry.length > 0
        ) {

            addRoute(

                "valhalla-route",

                data.valhalla.geometry,

                "#3498db",

                5

            );

        }


        /*
         * Google
         */

        if (
            data.google &&
            data.google.geometry &&
            data.google.geometry.length > 0
        ) {

            addRoute(

                "google-route",

                data.google.geometry,

                "#27ae60",

                4

            );

        }


        /*
         * Zoom map to routes
         */

        fitMapToRoutes(data);

    }


    /*
     * =====================================================
     * ADD ROUTE TO MAP
     * =====================================================
     */

    function addRoute(
        id,
        coordinates,
        color,
        width
    ) {

        const sourceId =
            id + "-source";


        const layerId =
            id + "-layer";


        /*
         * GeoJSON
         */

        const geojson = {

            type: "Feature",

            properties: {},

            geometry: {

                type: "LineString",

                coordinates: coordinates

            }

        };


        /*
         * Add source
         */

        map.addSource(
            sourceId,
            {

                type: "geojson",

                data: geojson

            }
        );


        /*
         * Add line layer
         */

        map.addLayer({

            id: layerId,

            type: "line",

            source: sourceId,

            layout: {

                "line-join": "round",

                "line-cap": "round"

            },

            paint: {

                "line-color": color,

                "line-width": width,

                "line-opacity": 0.8

            }

        });


        console.log(
            "Added route:",
            id
        );

    }


    /*
     * =====================================================
     * REMOVE OLD ROUTES
     * =====================================================
     */

    function removeExistingRoutes() {

        const routes = [

            "osrm-route",

            "valhalla-route",

            "google-route"

        ];


        routes.forEach(
            function (id) {

                const layerId =
                    id + "-layer";


                const sourceId =
                    id + "-source";


                if (
                    map.getLayer(layerId)
                ) {

                    map.removeLayer(
                        layerId
                    );

                }


                if (
                    map.getSource(sourceId)
                ) {

                    map.removeSource(
                        sourceId
                    );

                }

            }
        );

    }


    /*
     * =====================================================
     * FIT MAP TO ALL ROUTES
     * =====================================================
     */

    function fitMapToRoutes(data) {

        const allCoordinates = [];


        /*
         * OSRM
         */

        if (
            data.osrm &&
            data.osrm.geometry
        ) {

            allCoordinates.push(
                ...data.osrm.geometry
            );

        }


        /*
         * Valhalla
         */

        if (
            data.valhalla &&
            data.valhalla.geometry
        ) {

            allCoordinates.push(
                ...data.valhalla.geometry
            );

        }


        /*
         * Google
         */

        if (
            data.google &&
            data.google.geometry
        ) {

            allCoordinates.push(
                ...data.google.geometry
            );

        }


        /*
         * Nothing to fit
         */

        if (
            allCoordinates.length === 0
        ) {

            console.warn(
                "No route geometry found"
            );

            return;

        }


        /*
         * Create bounds
         */

        const bounds =
            new maplibregl.LngLatBounds();


        allCoordinates.forEach(
            function (coordinate) {

                if (
                    coordinate &&
                    coordinate.length >= 2
                ) {

                    bounds.extend(
                        coordinate
                    );

                }

            }
        );


        /*
         * Zoom map
         */

        map.fitBounds(
            bounds,
            {

                padding: 70,

                duration: 1000

            }
        );

    }


    /*
     * =====================================================
     * UPDATE RESULTS
     * =====================================================
     */

    function updateResults(data) {


        if (data.osrm) {

            document.getElementById(
                "osrm-result"
            ).innerHTML =
                formatResult(
                    data.osrm
                );

        }


        if (data.valhalla) {

            document.getElementById(
                "valhalla-result"
            ).innerHTML =
                formatResult(
                    data.valhalla
                );

        }


        if (data.google) {

            document.getElementById(
                "google-result"
            ).innerHTML =
                formatResult(
                    data.google
                );

        }

    }


    /*
     * =====================================================
     * FORMAT DISTANCE / DURATION
     * =====================================================
     */

    function formatResult(route) {

        const distance =
            Number(route.distance)
                .toFixed(2);


        const durationSeconds =
            Number(route.duration);


        const minutes =
            Math.round(
                durationSeconds / 60
            );


        return `
            Distance: ${distance} km<br>
            Duration: ${minutes} min
        `;

    }


    /*
     * =====================================================
     * BUTTON EVENT
     * =====================================================
     *
     * We deliberately use addEventListener instead of
     * onclick="compareRoutes()".
     *
     * This avoids the "compareRoutes is not defined"
     * problem you were getting.
     */

    document
        .getElementById("compareButton")
        .addEventListener(
            "click",
            compareRoutes
        );


</script>

</body>

</html>
